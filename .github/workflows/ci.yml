name: BreatheWise CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Backend Quality Gate (Ruff & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff pytest pytest-asyncio coverage bandit mypy pydantic

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type Check (mypy)
        run: mypy app/ --ignore-missing-imports

      - name: Security Scan (Bandit)
        run: bandit -r app/ -ll

      - name: Run Pytest with Coverage
        run: |
          coverage run -m pytest tests/ -v -m "not integration"
          coverage report --fail-under=80

  frontend-quality:
    name: Frontend Quality Gate (TypeScript & Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Run Unit Tests
        run: npm run test:ci

      - name: Production Build
        run: npm run build

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Smoke Tests
        run: npm run test:e2e

