[project]
name = "breathewise-backend"
version = "0.1.0"
description = "BreatheWise - Evidence-Based Urban Air Quality Assistant for Indian Families"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: integration tests that call real external providers (opt-in with RUN_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Comprehensive rule set: pycodestyle, pyflakes, isort, pyupgrade, bugbear,
# flake8-simplify, flake8-pie, Ruff-specific, perflint, pylint (errors only)
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PIE", "RUF", "PERF", "PLE"]
ignore = [
    "E501",      # line too long — handled by formatter
    "B008",      # do not perform function calls in default arguments (FastAPI Depends)
    "SIM108",    # ternary operator — not always more readable
    "RUF012",    # mutable class variables — Pydantic models use them intentionally
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use magic numbers in assertions and direct comparisons
"tests/**" = ["PLR2004", "PLR0912", "PLR0914", "PLR0915", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = false


